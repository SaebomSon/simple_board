<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('로그인')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('signIn')}"></header>
<main class="page page-narrow">
	<div class="text-center mb-4">
		<h1 class="h3 fw-bold mb-1">다시 오신 걸 환영해요</h1>
		<p class="text-secondary mb-0">아이디와 비밀번호로 로그인하세요.</p>
	</div>
	<div class="card-box card-pad">
		<th:block th:replace="~{fragments/layout :: flash}"></th:block>
		<div class="alert alert-danger py-2" th:if="${param.error}" th:switch="${param.error[0]}">
			<span th:case="'unverified'">인증되지 않은 계정입니다. 가입시 작성한 메일 계정을 확인해주세요.</span>
			<span th:case="'suspended'">정지된 회원입니다. 자세한 사항은 관리자에게 문의하세요.</span>
			<span th:case="*">존재하지 않거나 잘못된 정보입니다.</span>
		</div>
		<form method="post" th:action="@{/login}">
			<div class="mb-3">
				<label class="form-label" for="loginId">아이디</label>
				<input type="text" class="form-control" id="loginId" name="loginId" autocomplete="username" required autofocus>
			</div>
			<div class="mb-4">
				<label class="form-label" for="loginPw">비밀번호</label>
				<input type="password" class="form-control" id="loginPw" name="loginPw" autocomplete="current-password" required>
			</div>
			<button type="submit" class="btn btn-primary w-100 py-2">로그인</button>
		</form>
	</div>
	<p class="text-center text-secondary small mt-3">
		아직 회원이 아니신가요? <a th:href="@{/signUp}" class="fw-semibold">회원가입</a>
	</p>
</main>
</body>
</html>
