<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('비밀번호 찾기')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('signIn')}"></header>
<main class="page page-narrow">
	<div class="text-center mb-4">
		<h1 class="h3 fw-bold mb-1">비밀번호 찾기</h1>
		<p class="text-secondary mb-0">비밀번호를 새로 설정할 수 있는 링크를 메일로 보내드려요.</p>
	</div>
	<form class="card-box card-pad" method="post" th:action="@{/findPassword}">
		<div class="mb-3">
			<label class="form-label" for="id">아이디</label>
			<input type="text" class="form-control" id="id" name="id" autocomplete="username" required autofocus>
		</div>
		<div class="mb-4">
			<label class="form-label" for="email">가입한 이메일</label>
			<input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
		</div>
		<button type="submit" class="btn btn-primary w-100 py-2">재설정 링크 받기</button>
		<p class="form-text text-center mb-0 mt-3">링크는 30분 동안 한 번만 사용할 수 있습니다.</p>
	</form>
	<p class="text-center text-secondary small mt-3">
		<a th:href="@{/signIn}">로그인</a> · <a th:href="@{/findId}">아이디 찾기</a>
	</p>
</main>
</body>
</html>
