<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('비밀번호 재설정')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('signIn')}"></header>
<main class="page page-narrow">
	<div class="text-center mb-4">
		<h1 class="h3 fw-bold mb-1">새 비밀번호 설정</h1>
		<p class="text-secondary mb-0" th:if="${valid}">사용할 새 비밀번호를 입력하세요.</p>
	</div>

	<div class="card-box card-pad text-center" th:unless="${valid}">
		<i class="bi bi-exclamation-triangle text-warning fs-2"></i>
		<p class="mt-2 mb-3">유효하지 않거나 만료된 링크입니다.</p>
		<a class="btn btn-primary" th:href="@{/findPassword}">다시 요청하기</a>
	</div>

	<form class="card-box card-pad" method="post" th:action="@{/resetPassword}" th:if="${valid}">
		<th:block th:replace="~{fragments/layout :: flash}"></th:block>
		<input type="hidden" name="token" th:value="${token}">
		<div class="mb-3">
			<label class="form-label" for="newPassword">새 비밀번호</label>
			<input type="password" class="form-control" id="newPassword" name="newPassword" autocomplete="new-password"
				placeholder="영문, 특수문자 포함 6~18자" required autofocus>
			<div id="newPasswordCheck" class="form-text"></div>
		</div>
		<div class="mb-4">
			<label class="form-label" for="newPasswordConfirm">새 비밀번호 확인</label>
			<input type="password" class="form-control" id="newPasswordConfirm" autocomplete="new-password" required>
			<div id="newPasswordConfirmCheck" class="form-text"></div>
		</div>
		<button type="submit" id="resetBtn" class="btn btn-primary w-100 py-2" disabled>비밀번호 변경</button>
	</form>
</main>
<script>
const PW_REG = /^(?=.*[a-zA-Z])(?=.*[#?!@$%^&*-]).{6,18}$/;
$('#newPassword, #newPasswordConfirm').on('input', function () {
	const pw = $('#newPassword').val();
	const confirmPw = $('#newPasswordConfirm').val();
	const pwOk = PW_REG.test(pw);
	const same = pw !== '' && pw === confirmPw;
	$('#newPasswordCheck').text(pw === '' ? '' : pwOk ? '사용 가능한 비밀번호입니다.' : '비밀번호는 영문,특수문자 포함 6~18자리만 허용됩니다.')
		.removeClass('ok fail').addClass(pwOk ? 'ok' : 'fail');
	$('#newPasswordConfirmCheck').text(confirmPw === '' ? '' : same ? '확인되었습니다.' : '비밀번호가 다릅니다.')
		.removeClass('ok fail').addClass(same ? 'ok' : 'fail');
	$('#resetBtn').prop('disabled', !(pwOk && same));
});
</script>
</body>
</html>
