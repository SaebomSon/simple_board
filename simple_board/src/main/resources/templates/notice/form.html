<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('공지')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('admin')}"></header>
<!-- 공지 작성/수정 (noticeIdx가 있으면 수정) -->
<main class="page">
	<div class="page-head"><h1 th:text="${noticeIdx == null} ? '공지 작성' : '공지 수정'">공지 작성</h1></div>
	<form class="card-box card-pad" method="post" th:object="${form}"
		th:action="${noticeIdx == null} ? @{/admin/notices} : @{/admin/notices/{idx}/edit(idx=${noticeIdx})}">
		<div class="alert alert-danger py-2" th:if="${#fields.hasErrors('*')}">
			<div th:each="err : ${#fields.errors('*')}" th:text="${err}"></div>
		</div>
		<div class="d-flex gap-2 mb-3">
			<select th:field="*{type}" class="form-select" style="width: 9rem;" aria-label="공지 대상">
				<option value="0">전체 공지</option>
				<option th:each="type : ${boardTypes}" th:value="${type.code}" th:text="${type.label}">광장</option>
			</select>
			<input type="text" class="form-control" th:field="*{title}" maxlength="100" placeholder="제목" required>
		</div>
		<textarea class="form-control" rows="14" th:field="*{content}" maxlength="5000" placeholder="공지 내용을 입력하세요" required></textarea>
		<div class="d-flex justify-content-end gap-2 mt-4">
			<a class="btn btn-ghost" th:href="${noticeIdx == null} ? @{/admin} : @{/notices/{idx}(idx=${noticeIdx})}">취소</a>
			<button class="btn btn-primary px-4" type="submit" th:text="${noticeIdx == null} ? '등록' : '수정 완료'">등록</button>
		</div>
	</form>
</main>
</body>
</html>
