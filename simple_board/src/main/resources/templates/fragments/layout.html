<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="_csrf" th:content="${_csrf?.token}">
	<meta name="_csrf_header" th:content="${_csrf?.headerName}">
	<title th:text="|${title} · Simple Board|">Simple Board</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<link rel="stylesheet" th:href="@{/css/app.css}">
	<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script th:src="@{/js/app.js}"></script>
</head>
<body>

<!-- 상단 헤더. active: home / board-{code} / my / question / admin / signIn / signUp -->
<header th:fragment="header(active)" class="site-header sticky-top">
	<nav class="navbar navbar-expand-md">
		<div class="container" style="max-width: 1200px;">
			<a class="navbar-brand" th:href="${me != null and me.admin} ? @{/admin} : @{/}">Simple<span>Board</span></a>
			<button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
				aria-label="메뉴 열기">
				<i class="bi bi-list fs-4"></i>
			</button>
			<div class="collapse navbar-collapse" id="mainNav">
				<ul class="navbar-nav me-auto gap-md-1">
					<li class="nav-item">
						<a class="nav-link" th:classappend="${active == 'home'} ? 'active'" th:href="@{/}">홈</a>
					</li>
					<li class="nav-item" th:each="type : ${boardTypes}">
						<a class="nav-link" th:href="@{/boards/{code}(code=${type.code})}"
							th:classappend="|${active == 'board-' + type.code ? 'active' : ''} ${me != null and !me.canAccess(type) ? 'locked' : ''}|"
							th:attr="data-denied=${me != null and !me.canAccess(type)} ? '게시판에 접근할 수 없는 등급입니다.'">
							<i class="bi" th:classappend="${type.icon}"></i> <span th:text="${type.label}">Leaf</span>
						</a>
					</li>
				</ul>

				<div class="d-flex align-items-center gap-2 mt-2 mt-md-0" th:if="${me == null}">
					<a class="btn btn-ghost btn-sm" th:href="@{/signIn}">로그인</a>
					<a class="btn btn-primary btn-sm" th:href="@{/signUp}">회원가입</a>
				</div>

				<div class="dropdown mt-2 mt-md-0" th:if="${me != null}">
					<a class="user-menu-toggle dropdown-toggle" href="#" data-bs-toggle="dropdown" aria-expanded="false">
						<span class="avatar avatar-sm" th:text="${me.initial}">새</span>
						<span th:text="${me.nickname}">nickname</span>
					</a>
					<ul class="dropdown-menu dropdown-menu-end">
						<li class="px-3 py-2">
							<div class="fw-semibold" th:text="${me.nickname}">nickname</div>
							<small class="text-secondary" th:text="${me.admin} ? '관리자' : ${me.levelName}">준회원1</small>
						</li>
						<li><hr class="dropdown-divider"></li>
						<th:block th:unless="${me.admin}">
							<li><a class="dropdown-item" th:href="@{/profile}"><i class="bi bi-person-circle me-2"></i>내 정보</a></li>
							<li><a class="dropdown-item" th:href="@{/my/posts}"><i class="bi bi-journal-text me-2"></i>내 활동</a></li>
							<li><a class="dropdown-item" th:href="@{/questions/new}"><i class="bi bi-question-circle me-2"></i>문의하기</a></li>
						</th:block>
						<li th:if="${me.admin}"><a class="dropdown-item" th:href="@{/admin}"><i class="bi bi-shield-lock me-2"></i>관리자</a></li>
						<li><hr class="dropdown-divider"></li>
						<li>
							<form th:action="@{/logout}" method="post">
								<button type="submit" class="dropdown-item"><i class="bi bi-box-arrow-right me-2"></i>로그아웃</button>
							</form>
						</li>
					</ul>
				</div>
			</div>
		</div>
	</nav>
</header>

<!-- 처리 결과 메시지 (RedirectAttributes flash) -->
<th:block th:fragment="flash">
	<div th:if="${message}" class="alert alert-success d-flex align-items-center gap-2 py-2" role="alert">
		<i class="bi bi-check2-circle"></i><span th:text="${message}"></span>
	</div>
	<div th:if="${error}" class="alert alert-danger d-flex align-items-center gap-2 py-2" role="alert">
		<i class="bi bi-exclamation-triangle"></i><span th:text="${error}"></span>
	</div>
</th:block>

<!-- 목록 하단 페이지 번호. pageUrl은 "...&page=" 로 끝나는 주소 -->
<nav th:fragment="pagination(pagination, pageUrl)" class="d-flex justify-content-center mt-4" th:if="${pagination.lastPage() > 1}">
	<ul class="pagination mb-0">
		<li class="page-item" th:if="${pagination.hasPrevBlock()}">
			<a class="page-link" th:href="@{${pageUrl + (pagination.blockStart() - 1)}}" aria-label="이전"><i class="bi bi-chevron-left"></i></a>
		</li>
		<li class="page-item" th:each="num : ${pagination.pages()}" th:classappend="${num == pagination.page()} ? 'active'">
			<a class="page-link" th:href="@{${pageUrl + num}}" th:text="${num}">1</a>
		</li>
		<li class="page-item" th:if="${pagination.hasNextBlock()}">
			<a class="page-link" th:href="@{${pageUrl + (pagination.blockEnd() + 1)}}" aria-label="다음"><i class="bi bi-chevron-right"></i></a>
		</li>
	</ul>
</nav>

<footer th:fragment="footer" class="site-footer">© Simple Board</footer>

</body>
</html>
