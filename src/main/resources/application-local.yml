# 로컬 실행용: MySQL 없이 인메모리 H2(MySQL 모드)로 기동한다.
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
spring:
  datasource:
    url: jdbc:h2:mem:simple_board;MODE=MySQL;NON_KEYWORDS=USER,VALUE;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data-local.sql

app:
  # 메일을 보내지 않고 인증 링크를 로그로 출력
  mail-enabled: false
