spring:
  datasource:
    url: jdbc:h2:mem:simple_board_test;MODE=MySQL;NON_KEYWORDS=USER,VALUE;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data-local.sql

app:
  mail-enabled: false
  upload-dir: target/test-uploads
